repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.11
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        language_version: python3.11
  - repo: local
    hooks:
      - id: pytest-backend
        name: pytest (backend)
        entry: bash -c "cd apps/backend && pytest"
        language: system
        pass_filenames: false
      - id: lint-web
        name: npm lint (web)
        entry: bash -c "npm run lint:web"
        language: system
        pass_filenames: false
      - id: lint-mobile
        name: npm lint (mobile)
        entry: bash -c "npm run lint:mobile"
        language: system
        pass_filenames: false
